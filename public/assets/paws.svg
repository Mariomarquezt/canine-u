<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <symbol id="paw" viewBox="-50 -50 100 100">
      
      <ellipse cx="0" cy="14" rx="20" ry="17" fill="currentColor"></ellipse>
      
      <ellipse cx="-22" cy="-10" rx="8" ry="11" transform="rotate(-22 -22 -10)" fill="currentColor"></ellipse>
      <ellipse cx="-9" cy="-22" rx="7.5" ry="11" transform="rotate(-8 -9 -22)" fill="currentColor"></ellipse>
      <ellipse cx="9" cy="-22" rx="7.5" ry="11" transform="rotate(8 9 -22)" fill="currentColor"></ellipse>
      <ellipse cx="22" cy="-10" rx="8" ry="11" transform="rotate(22 22 -10)" fill="currentColor"></ellipse>
    </symbol>
    <pattern id="paws" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <use href="#paw" x="50" y="50" width="50" height="50"></use>
      <use href="#paw" x="150" y="50" width="50" height="50"></use>
      <use href="#paw" x="0" y="150" width="50" height="50"></use>
      <use href="#paw" x="100" y="150" width="50" height="50"></use>
      <use href="#paw" x="200" y="150" width="50" height="50"></use>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#paws)"></rect>
</svg>